name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: linux-amd64
            kernel_arch: linux-amd64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            artifact: linux-arm64
            kernel_arch: linux-arm64
          # MIPS 小路由（MT7621 / Cudy AC1200 等）。
          # mipsel 是 Tier 3 目标：需要 nightly + build-std + musl 交叉工具链。
          # continue-on-error：mipsel 构建失败不影响主流平台发版。
          - os: ubuntu-latest
            target: mipsel-unknown-linux-musl
            artifact: linux-mipsle
            kernel_arch: mipsle-softfloat
            mipsel: true
            continue-on-error: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows-amd64
            kernel_arch: windows-amd64
    runs-on: ${{ matrix.os }}
    env:
      # 与发布版本固定配对的内核；升级内核改这两行即可
      SB_VER: "1.14.3"
      MH_VER: "1.19.33"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.mipsel == true && 'nightly-2026-11-01' || 'stable' }}
          targets: ${{ matrix.target }}
          components: ${{ matrix.mipsel == true && 'rust-src' || '' }}

      - name: Install cargo-zigbuild + zig
        if: runner.os == 'Linux' && matrix.mipsel != true
        run: |
          pip install ziglang
          cargo install cargo-zigbuild

      # mipsel 不能用 zig 当 libc（对 mips 支持 incomplete），用 musl.cc 交叉工具链链接
      - name: Install musl cross toolchain (mipsel)
        if: matrix.mipsel == true
        run: |
          set -e
          curl -fsSL --connect-timeout 20 -o /tmp/mipsel-cross.tgz http://musl.cc/mipsel-linux-musl-cross.tgz \
            || curl -fsSL --connect-timeout 20 -o /tmp/mipsel-cross.tgz https://github.com/musl-cc/musl.cc/raw/master/mipsel-linux-musl-cross.tgz
          sudo mkdir -p /opt/cross
          sudo tar -xzf /tmp/mipsel-cross.tgz -C /opt/cross
          echo "/opt/cross/mipsel-linux-musl-cross/bin" >> "$GITHUB_PATH"

      - name: Build
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -e
          if [ "${{ matrix.mipsel }}" = "true" ]; then
            export CARGO_TARGET_MIPSEL_UNKNOWN_LINUX_MUSL_LINKER=mipsel-linux-musl-gcc
            export CC_mipsel_unknown_linux_musl=mipsel-linux-musl-gcc
            export AR_mipsel_unknown_linux_musl=mipsel-linux-musl-ar
            # MT7621 无 FPU：软浮点；musl 目标默认 crt-static，产出静态 PIE
            export RUSTFLAGS="-C target-feature=+soft-float -C link-arg=-static -C link-arg=-static-libgcc"
            cargo +nightly build -Z build-std=std,panic_abort --release --target mipsel-unknown-linux-musl
            BIN="target/mipsel-unknown-linux-musl/release/sing-box-web"
          elif [ "${{ runner.os }}" = "Linux" ]; then
            cargo zigbuild --release --target ${{ matrix.target }}
            BIN="target/${{ matrix.target }}/release/sing-box-web"
          else
            cargo build --release --target ${{ matrix.target }}
            BIN="target/${{ matrix.target }}/release/sing-box-web.exe"
          fi
          echo "BIN=$BIN" >> "$GITHUB_ENV"

      - name: Download kernels
        shell: bash
        run: |
          set -e
          mkdir -p pkg
          KA="${{ matrix.kernel_arch }}"
          if [ "$KA" = "windows-amd64" ]; then
            curl -fsSL -o sb.zip "https://github.com/SagerNet/sing-box/releases/download/v${SB_VER}/sing-box-${SB_VER}-windows-amd64.zip"
            unzip -j sb.zip "*/sing-box.exe" -d pkg
            curl -fsSL -o pkg/mihomo.exe.gz "https://github.com/MetaCubeX/mihomo/releases/download/v${MH_VER}/mihomo-windows-amd64-v${MH_VER}.gz"
            gunzip -f pkg/mihomo.exe.gz
          elif [ "$KA" = "mipsle-softfloat" ]; then
            curl -fsSL -o sb.tgz "https://github.com/SagerNet/sing-box/releases/download/v${SB_VER}/sing-box-${SB_VER}-linux-mipsle-softfloat.tar.gz"
            tar -xzf sb.tgz
            cp sing-box-${SB_VER}-linux-mipsle-softfloat/sing-box pkg/
            curl -fsSL -o pkg/mihomo.gz "https://github.com/MetaCubeX/mihomo/releases/download/v${MH_VER}/mihomo-linux-mipsle-softfloat-v${MH_VER}.gz"
            gunzip -f pkg/mihomo.gz
          else
            curl -fsSL -o sb.tgz "https://github.com/SagerNet/sing-box/releases/download/v${SB_VER}/sing-box-${SB_VER}-${KA}.tar.gz"
            tar -xzf sb.tgz
            cp sing-box-${SB_VER}-${KA}/sing-box pkg/
            curl -fsSL -o pkg/mihomo.gz "https://github.com/MetaCubeX/mihomo/releases/download/v${MH_VER}/mihomo-${KA}-v${MH_VER}.gz"
            gunzip -f pkg/mihomo.gz
          fi

      - name: Package
        shell: bash
        run: |
          set -e
          VERSION="${GITHUB_REF_NAME#v}"
          NAME="sing-box-web-rust-${VERSION}-${{ matrix.artifact }}"
          mkdir -p "dist/$NAME"
          cp "$BIN" "dist/$NAME/panel${{ runner.os == 'Windows' && '.exe' || '' }}"
          cp pkg/sing-box* "dist/$NAME/" 2>/dev/null || true
          [ -f pkg/mihomo ] && cp pkg/mihomo "dist/$NAME/" || true
          [ -f pkg/mihomo.exe ] && cp pkg/mihomo.exe "dist/$NAME/" || true
          cp -r deploy/* "dist/$NAME/"
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "${NAME}.zip" "$NAME"
          else
            chmod +x "$NAME/panel" "$NAME/sing-box" "$NAME/mihomo" 2>/dev/null || true
            tar -czf "${NAME}.tar.gz" "$NAME"
          fi
          cd ..
          FILE=$(ls dist/${NAME}.tar.gz dist/${NAME}.zip 2>/dev/null | head -1)
          sha256sum "$FILE" > "${FILE}.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.artifact }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          fail_on_unmatched_files: false
          generate_release_notes: true
