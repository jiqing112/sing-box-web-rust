name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: linux-amd64
            kernel_arch: linux-amd64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            artifact: linux-arm64
            kernel_arch: linux-arm64
          # MIPS 小路由（MT7621 / Cudy AC1200 等）。
          # mipsel 是 Tier 3 目标：需要 nightly + build-std + musl 交叉工具链。
          # continue-on-error：mipsel 构建失败不影响主流平台发版。
          - os: ubuntu-latest
            target: mipsel-unknown-linux-musl
            artifact: linux-mipsle
            kernel_arch: mipsle-softfloat
            mipsel: true
            continue-on-error: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows-amd64
            kernel_arch: windows-amd64
    runs-on: ${{ matrix.os }}
    env:
      # 与发布版本固定配对的内核；升级内核改这两行即可
      SB_VER: "1.14.3"
      MH_VER: "1.19.33"
      # mipsel 用的钉死 nightly：cargo +nightly 会命中 runner 预装的旧 nightly
      # （无 rust-src，build-std 直接失败），必须显式指名
      NIGHTLY: nightly-2026-11-01
    steps:
      - uses: actions/checkout@v4

      # 注意：mipsel 不能让 rustup 装 target——Tier 3 没有预编译 rust-std，
      # build-std 从源码编译 std，只需要 nightly + rust-src
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.mipsel == true && env.NIGHTLY || 'stable' }}
          targets: ${{ matrix.mipsel != true && matrix.target || '' }}
          components: ${{ matrix.mipsel == true && 'rust-src' || '' }}

      - name: Install cargo-zigbuild + zig
        if: runner.os == 'Linux' && matrix.mipsel != true
        run: |
          pip install ziglang
          cargo install cargo-zigbuild

      # mipsel 不能用 zig 当 libc（对 mips 支持不完整）；
      # 用 OpenWrt 官方 SDK 自带的 mipsel musl 工具链（与 MT7621 同款配置，downloads.openwrt.org 高可用）
      - name: Install musl cross toolchain (mipsel)
        if: matrix.mipsel == true
        run: |
          set -e
          curl -fsSL --connect-timeout 20 -o /tmp/sdk.tar.zst "https://downloads.openwrt.org/releases/24.10.0/targets/ramips/mt7621/openwrt-sdk-24.10.0-ramips-mt7621_gcc-13.3.0_musl.Linux-x86_64.tar.zst"
          sudo mkdir -p /opt/cross
          sudo tar --zstd -xf /tmp/sdk.tar.zst -C /opt/cross --strip-components=1
          TC=$(find /opt/cross/staging_dir -maxdepth 1 -name 'toolchain-*' | head -1)
          echo "$TC/bin" >> "$GITHUB_PATH"
          echo "STAGING_DIR=$TC" >> "$GITHUB_ENV"

      - name: Build
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -e
          if [ "${{ matrix.mipsel }}" = "true" ]; then
            export CARGO_TARGET_MIPSEL_UNKNOWN_LINUX_MUSL_LINKER=mipsel-openwrt-linux-musl-gcc
            export CC_mipsel_unknown_linux_musl=mipsel-openwrt-linux-musl-gcc
            export AR_mipsel_unknown_linux_musl=mipsel-openwrt-linux-musl-ar
            # MT7621 无 FPU：软浮点。动态链接 OpenWrt musl（基线自带 loader 与 libgcc_s）；
            # 该 target 的 crt-static 需要 libunwind，SDK musl 不提供，静态方案放弃
            export RUSTFLAGS="-C target-feature=+soft-float"
            cargo +${{ env.NIGHTLY }} build -Z build-std=std,panic_abort --release --target mipsel-unknown-linux-musl
            BIN="target/mipsel-unknown-linux-musl/release/sing-box-web"
          elif [ "${{ runner.os }}" = "Linux" ]; then
            cargo zigbuild --release --target ${{ matrix.target }}
            BIN="target/${{ matrix.target }}/release/sing-box-web"
          else
            cargo build --release --target ${{ matrix.target }}
            BIN="target/${{ matrix.target }}/release/sing-box-web.exe"
          fi
          echo "BIN=$BIN" >> "$GITHUB_ENV"

      - name: Download kernels
        shell: bash
        run: |
          set -e
          mkdir -p pkg
          KA="${{ matrix.kernel_arch }}"
          if [ "$KA" = "windows-amd64" ]; then
            curl -fsSL -o sb.zip "https://github.com/SagerNet/sing-box/releases/download/v${SB_VER}/sing-box-${SB_VER}-windows-amd64.zip"
            unzip -j sb.zip "*/sing-box.exe" -d pkg
            # 官方 zip 里带 wintun.dll：一起打进去，老版本内核/被安全软件清掉时仍能开 TUN
            unzip -j sb.zip "*/wintun.dll" -d pkg || true
            # mihomo 的 Windows 资产是 zip（exe 名带版本号）
            curl -fsSL -o mihomo.zip "https://github.com/MetaCubeX/mihomo/releases/download/v${MH_VER}/mihomo-windows-amd64-v${MH_VER}.zip"
            unzip -jo mihomo.zip "mihomo-*.exe" -d pkg
            mv pkg/mihomo-*.exe pkg/mihomo.exe
          elif [ "$KA" = "mipsle-softfloat" ]; then
            curl -fsSL -o sb.tgz "https://github.com/SagerNet/sing-box/releases/download/v${SB_VER}/sing-box-${SB_VER}-linux-mipsle-softfloat.tar.gz"
            tar -xzf sb.tgz
            cp sing-box-${SB_VER}-linux-mipsle-softfloat/sing-box pkg/
            curl -fsSL -o pkg/mihomo.gz "https://github.com/MetaCubeX/mihomo/releases/download/v${MH_VER}/mihomo-linux-mipsle-softfloat-v${MH_VER}.gz"
            gunzip -f pkg/mihomo.gz
          else
            curl -fsSL -o sb.tgz "https://github.com/SagerNet/sing-box/releases/download/v${SB_VER}/sing-box-${SB_VER}-${KA}.tar.gz"
            tar -xzf sb.tgz
            cp sing-box-${SB_VER}-${KA}/sing-box pkg/
            curl -fsSL -o pkg/mihomo.gz "https://github.com/MetaCubeX/mihomo/releases/download/v${MH_VER}/mihomo-${KA}-v${MH_VER}.gz"
            gunzip -f pkg/mihomo.gz
          fi

      - name: Package
        shell: bash
        run: |
          set -ex
          VERSION="${GITHUB_REF_NAME#v}"
          NAME="sing-box-web-rust-${VERSION}-${{ matrix.artifact }}"
          mkdir -p "dist/$NAME"
          cp "$BIN" "dist/$NAME/panel${{ runner.os == 'Windows' && '.exe' || '' }}"
          cp pkg/sing-box* "dist/$NAME/" 2>/dev/null || true
          if [ -f pkg/mihomo ]; then cp pkg/mihomo "dist/$NAME/"; fi
          if [ -f pkg/mihomo.exe ]; then cp pkg/mihomo.exe "dist/$NAME/"; fi
          if [ -f pkg/wintun.dll ]; then cp pkg/wintun.dll "dist/$NAME/"; fi
          cp -r deploy/* "dist/$NAME/"
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "${NAME}.zip" "$NAME"
          else
            chmod +x "$NAME/panel" "$NAME/sing-box" "$NAME/mihomo" 2>/dev/null || true
            tar -czf "${NAME}.tar.gz" "$NAME"
          fi
          cd ..
          if [ -f "dist/${NAME}.tar.gz" ]; then
            FILE="dist/${NAME}.tar.gz"
          elif [ -f "dist/${NAME}.zip" ]; then
            FILE="dist/${NAME}.zip"
          else
            echo "package not produced" >&2
            ls -la dist >&2
            exit 2
          fi
          sha256sum "$FILE" > "${FILE}.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.artifact }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          fail_on_unmatched_files: false
          generate_release_notes: true
